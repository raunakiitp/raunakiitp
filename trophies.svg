    <clipPath id="tClip600"><rect width="170" height="160" rx="14"/></clipPath>
    <rect x="-60" width="60" height="160" fill="url(#shine2)" transform="skewX(-20)">
      <animate attributeName="x" values="-60;230" dur="2.6s" begin="2.25s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="85" cy="55" r="30" fill="none" stroke="#f472b6" stroke-width="3" filter="url(#tGlow)">
    <animate attributeName="r" values="26;30;26" dur="2s" begin="1.05s" repeatCount="indefinite"/>
  </circle>
  <text x="85" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#f5f3ff">B+</text>
  <text x="85" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e5e7eb">Quickdraw</text>
