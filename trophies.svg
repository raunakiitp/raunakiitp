  <text x="85" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#f5f3ff">A+</text>
  <text x="85" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e5e7eb">Pair Extraordinaire</text>
</g>
<g transform="translate(410,20) scale(0.9)" opacity="0">
  <animate attributeName="opacity" to="1" dur="0.4s" begin="0.80s" fill="freeze"/>
  <animateTransform attributeName="transform" type="scale" additive="sum" from="0.7" to="1" dur="0.4s" begin="0.80s" fill="freeze"/>
