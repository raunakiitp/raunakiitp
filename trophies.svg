  </g>
  <circle cx="85" cy="55" r="30" fill="none" stroke="#7dd3fc" stroke-width="3" filter="url(#tGlow)">
    <animate attributeName="r" values="26;30;26" dur="2s" begin="0.80s" repeatCount="indefinite"/>
  </circle>
  <text x="85" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#f5f3ff">A</text>
  <text x="85" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e5e7eb">YOLO</text>
