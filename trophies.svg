<svg width="820" height="200" viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#a855f7"/>
  </linearGradient>
  <linearGradient id="shine2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="tGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="820" height="200" rx="16" fill="#150a24" stroke="#a855f7" stroke-width="1"/>
<g transform="translate(30,20) scale(0.9)" opacity="0">
  <animate attributeName="opacity" to="1" dur="0.4s" begin="0.30s" fill="freeze"/>
  <animateTransform attributeName="transform" type="scale" additive="sum" from="0.7" to="1" dur="0.4s" begin="0.30s" fill="freeze"/>
  <rect width="170" height="160" rx="14" fill="#1e1030" stroke="#ff6ec7" stroke-width="1.4"/>
  <g clip-path="url(#tClip30)">
    <clipPath id="tClip30"><rect width="170" height="160" rx="14"/></clipPath>
    <rect x="-60" width="60" height="160" fill="url(#shine2)" transform="skewX(-20)">
      <animate attributeName="x" values="-60;230" dur="2.6s" begin="1.50s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="85" cy="55" r="30" fill="none" stroke="#ff6ec7" stroke-width="3" filter="url(#tGlow)">
    <animate attributeName="r" values="26;30;26" dur="2s" begin="0.30s" repeatCount="indefinite"/>
  </circle>
  <text x="85" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#f5f3ff">S</text>
  <text x="85" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#e5e7eb">Pull Shark</text>
</g>
<g transform="translate(220,20) scale(0.9)" opacity="0">
  <animate attributeName="opacity" to="1" dur="0.4s" begin="0.55s" fill="freeze"/>
  <animateTransform attributeName="transform" type="scale" additive="sum" from="0.7" to="1" dur="0.4s" begin="0.55s" fill="freeze"/>
  <rect width="170" height="160" rx="14" fill="#1e1030" stroke="#a855f7" stroke-width="1.4"/>
  <g clip-path="url(#tClip220)">
